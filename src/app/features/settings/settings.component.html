<div class="settings-panel" [attr.aria-busy]="isLoading() || isSaving()">
  <!-- Appearance section -->
  <section class="settings-section" aria-labelledby="appearance-heading">
    <div class="section-meta">
      <i class="pi pi-sliders-h section-icon" aria-hidden="true"></i>
      <div class="section-meta-text">
        <h3 id="appearance-heading" class="section-title">
          {{ "settings.appearance" | translate }}
        </h3>
        <p class="section-desc">{{ "settings.appearance_desc" | translate }}</p>
      </div>
    </div>

    <!-- Theme selector — handles both colour theme and dark/light mode -->
    <ds-theme-selector />
  </section>

  <!-- Timezone section -->
  <section class="settings-section" aria-labelledby="timezone-heading">
    <div class="section-meta">
      <i class="pi pi-globe section-icon" aria-hidden="true"></i>
      <div class="section-meta-text">
        <h3 id="timezone-heading" class="section-title">
          {{ "settings.timezone" | translate }}
        </h3>
        <p class="section-desc">{{ "settings.timezone_desc" | translate }}</p>
      </div>
    </div>

    <div class="setting-row setting-row--column">
      <label for="timezone-select" class="setting-label">
        {{ "settings.timezone_label" | translate }}
      </label>

      <p-select
        inputId="timezone-select"
        [options]="options"
        optionLabel="label"
        optionValue="value"
        [ngModel]="selectedTimezone()"
        (onChange)="onTimezoneChange($event.value)"
        [loading]="isLoading()"
        [disabled]="isLoading() || isSaving()"
        [filter]="true"
        filterBy="label"
        [placeholder]="'settings.timezone_placeholder' | translate"
        [ariaLabel]="'settings.timezone_label' | translate"
        [fluid]="true"
      ></p-select>

      @if (isSaving()) {
        <div
          class="saving-indicator"
          aria-live="polite"
          aria-atomic="true"
          role="status"
        >
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
          <span>{{ "settings.saving" | translate }}</span>
        </div>
      }
    </div>
  </section>
</div>
