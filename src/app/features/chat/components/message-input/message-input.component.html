<div class="message-input-container" role="form" aria-label="Compose message">
  <textarea
    pTextarea
    class="message-input"
    [formControl]="messageControl"
    (keydown)="onKeyDown($event)"
    [autoResize]="true"
    [fluid]="true"
    [placeholder]="'messaging.placeholder' | translate"
    rows="1"
    autocomplete="off"
    autocorrect="on"
    autocapitalize="sentences"
    spellcheck="true"
    [attr.aria-label]="'messaging.message_label' | translate"
    aria-describedby="send-hint"
    [attr.aria-disabled]="isSending()"
    [disabled]="isSending()"
  ></textarea>

  <!-- Actions: emoji, attach, mic, send -->
  <div class="input-actions" role="group" aria-label="Message actions">
    <ds-icon-button
      icon="pi-face-smile"
      ariaLabel="Insert emoji"
      variant="ghost"
      pTooltip="Emoji"
      tooltipPosition="top"
    />
    <ds-icon-button
      icon="pi-paperclip"
      ariaLabel="Attach file"
      variant="ghost"
      pTooltip="Attach file"
      tooltipPosition="top"
    />
    <ds-icon-button
      icon="pi-microphone"
      ariaLabel="Record voice message"
      variant="ghost"
      pTooltip="Voice message"
      tooltipPosition="top"
    />

    <p-button
      class="send-button"
      [label]="'messaging.send_button' | translate"
      [loading]="isSending()"
      [disabled]="!messageText().trim() || isSending()"
      [attr.aria-label]="'messaging.send_button' | translate"
      pTooltip="Send (Enter)"
      tooltipPosition="top"
      severity="secondary"
      [outlined]="true"
      (onClick)="onSend()"
    />
  </div>

  <!-- Links to textarea via aria-describedby — announced on focus by screen readers -->
  <span id="send-hint" class="sr-only">
    {{ "messaging.send_hint" | translate }}
  </span>

  <span aria-live="polite" aria-atomic="true" class="sr-only">
    @if (isSending()) {
      <span>{{ "messaging.sending" | translate }}</span>
    }
  </span>
</div>
