@if (currentUser(); as user) {
  <div class="profile-card">
    <ds-avatar [user]="user" size="md" [showOnline]="true" [isOnline]="true" />

    <!-- User info -->
    <div class="user-info">
      <span class="user-name">{{ userDisplayName() }}</span>
      @if (user.jobTitle) {
        <span class="user-title">{{ user.jobTitle }}</span>
      }
    </div>

    <!-- Actions -->
    <div
      class="actions"
      role="group"
      [attr.aria-label]="'profile.actions' | translate"
    >
      <ds-icon-button
        icon="pi-cog"
        [ariaLabel]="'settings.open' | translate"
        [attr.aria-expanded]="settingsDrawer.isVisible()"
        aria-controls="settings-drawer"
        (clicked)="openSettings()"
      />

      <ds-icon-button
        [icon]="isLoggingOut() ? 'pi-spin pi-spinner' : 'pi-sign-out'"
        [ariaLabel]="'global.btn_logout' | translate"
        [disabled]="isLoggingOut()"
        (clicked)="logout()"
      />
    </div>

    <app-settings-drawer #settingsDrawer></app-settings-drawer>
  </div>
}
