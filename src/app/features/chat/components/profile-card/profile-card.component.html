@if (currentUser(); as user) {
  <div class="profile-card">
    <div class="profile-info">
      @if (user.profilePictureUrl) {
        <img
          [src]="user.profilePictureUrl"
          [alt]="(user.displayName && user.displayName.trim()) || user.username"
          class="avatar"
        />
      } @else {
        <div class="avatar-fallback">{{ avatarText }}</div>
      }

      <div class="user-details">
        <h4>
          {{
            (user.displayName && user.displayName.trim()) ||
              user.username ||
              user.email
          }}
        </h4>
        @if (user.jobTitle) {
          <p>{{ user.jobTitle }}</p>
        }
      </div>
    </div>

    <div class="profile-actions">
      <app-button
        class="settings-btn"
        [label]="'settings.open' | translate"
        (clicked)="openSettings()"
        [disabled]="false"
        [loading]="false"
        [type]="'button'"
        [attr.aria-expanded]="settingsDrawer?.isVisible() ?? false"
        aria-controls="settings-drawer"
      ></app-button>

      <app-button
        class="logout-btn"
        [label]="'global.btn_logout' | translate"
        (clicked)="logout()"
        [type]="'button'"
      ></app-button>
    </div>

    <app-settings-drawer #settingsDrawer></app-settings-drawer>
  </div>
}
