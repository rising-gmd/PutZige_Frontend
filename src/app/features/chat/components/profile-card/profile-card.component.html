@if (currentUser(); as user) {
  <div class="profile-card">
    <!-- Avatar -->
    <div class="avatar-wrap">
      @if (user.profilePictureUrl) {
        <img
          [src]="user.profilePictureUrl"
          [alt]="(user.displayName && user.displayName.trim()) || user.username"
          class="avatar"
        />
      } @else {
        <div class="avatar-fallback" aria-hidden="true">{{ avatarText }}</div>
      }
      <div class="status-dot" aria-hidden="true"></div>
    </div>

    <!-- User info -->
    <div class="user-meta">
      <span class="user-name">
        {{
          (user.displayName && user.displayName.trim()) ||
            user.username ||
            user.email
        }}
      </span>
      @if (user.jobTitle) {
        <span class="user-title">{{ user.jobTitle }}</span>
      }
    </div>

    <!-- Spacer -->
    <div class="spacer"></div>

    <!-- Icon actions -->
    <div
      class="actions"
      role="group"
      [attr.aria-label]="'profile.actions' | translate"
    >
      <button
        class="action-btn"
        type="button"
        (click)="openSettings()"
        [attr.aria-expanded]="settingsDrawer?.isVisible() ?? false"
        aria-controls="settings-drawer"
        [attr.aria-label]="'settings.open' | translate"
        [title]="'settings.open' | translate"
      >
        <i class="pi pi-cog" aria-hidden="true"></i>
      </button>

      <button
        class="action-btn action-btn--danger"
        type="button"
        (click)="logout()"
        [disabled]="isLoggingOut()"
        [attr.aria-label]="'global.btn_logout' | translate"
        [title]="'global.btn_logout' | translate"
      >
        @if (isLoggingOut()) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        } @else {
          <i class="pi pi-sign-out" aria-hidden="true"></i>
        }
      </button>
    </div>

    <app-settings-drawer #settingsDrawer></app-settings-drawer>
  </div>
}
