<div
  class="bubble-row"
  [class.own]="isOwnMessage"
  [class.other]="!isOwnMessage"
  [class.optimistic]="message.isOptimistic"
>
  <!-- "…" context menu button (hidden until hover) -->
  <div
    class="bubble-actions"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <button
      class="bubble-menu-btn"
      [class.menu-open]="menuVisible"
      type="button"
      aria-label="Message options"
      [attr.aria-expanded]="menuVisible"
      aria-haspopup="menu"
      (click)="toggleMenu($event)"
    >
      <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
    </button>

    <p-menu
      #bubbleMenu
      [model]="menuItems"
      [popup]="true"
      styleClass="chat-context-menu"
      appendTo="body"
      (onShow)="menuVisible = true"
      (onHide)="menuVisible = false"
    ></p-menu>
  </div>

  <!-- Bubble -->
  <div class="bubble" role="article" [attr.aria-label]="bubbleAriaLabel">
    <span class="bubble-text">{{ message.messageText }}</span>

    <div class="bubble-footer" aria-hidden="true">
      <time
        class="bubble-time"
        [attr.datetime]="message.sentAt.toISOString()"
        >{{ message.sentAt | messageTime }}</time
      >

      @if (isOwnMessage) {
        <i class="pi {{ statusIcon }} bubble-status {{ statusClass }}"></i>
      }
    </div>
  </div>
</div>
