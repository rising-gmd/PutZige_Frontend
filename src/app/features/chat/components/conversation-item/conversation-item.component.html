<div
  class="conversation-item"
  [class.active]="isActive()"
  role="option"
  [attr.aria-selected]="isActive()"
  [attr.aria-label]="ariaLabel()"
  tabindex="0"
  (click)="onSelect()"
  (keydown.enter)="onSelect()"
  (keydown.space)="$event.preventDefault(); onSelect()"
>
  <ds-avatar
    [user]="conversation()"
    size="sm"
    [showOnline]="true"
    [isOnline]="conversation().isOnline"
  />

  <div class="conversation-details">
    <div class="header-row">
      <h4 class="user-name">{{ displayName() }}</h4>
      <span class="timestamp">{{
        conversation().lastActivity | conversationTime
      }}</span>
    </div>
    <div class="preview-row">
      @if (conversation().isTyping) {
        <span class="typing-indicator" aria-live="polite">typing...</span>
      } @else {
        <p class="message-preview">{{ lastMessagePreview() }}</p>
      }
      @if (conversation().unreadCount > 0) {
        <div
          class="unread-badge"
          role="status"
          [attr.aria-label]="conversation().unreadCount + ' unread'"
        >
          {{
            conversation().unreadCount > 99 ? "99+" : conversation().unreadCount
          }}
        </div>
      }
    </div>
  </div>

  <div
    class="item-actions"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <ds-icon-button
      icon="pi-ellipsis-h"
      [ariaLabel]="'More options for ' + displayName()"
      aria-haspopup="menu"
      (clicked)="toggleMenu($event)"
    />

    <p-menu
      #itemMenu
      [model]="menuItems()"
      [popup]="true"
      styleClass="chat-context-menu"
      appendTo="body"
    ></p-menu>
  </div>
</div>
