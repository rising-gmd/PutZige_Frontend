<div class="chat-container">
  <!-- Sidebar: conversation list + profile card -->
  <aside
    class="chat-sidebar"
    [class.sidebar-open]="sidebarOpen()"
    aria-label="Conversations panel"
  >
    <app-conversation-list></app-conversation-list>
    <app-profile-card></app-profile-card>
  </aside>

  <!-- Main area: chat -->
  <main class="chat-main" aria-label="Chat area">
    <app-chat-area></app-chat-area>
  </main>
</div>
