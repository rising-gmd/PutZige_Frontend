<!-- Path: src/app/features/chat/components/message-list/message-list.component.html -->

<div class="message-list-viewport" #viewport>
  <div class="message-list" role="log" aria-live="polite" aria-label="Messages">
    @for (group of messageGroups; track group.date) {
      <!-- Date divider -->
      <div class="date-divider" role="separator">
        <span>{{ group.date }}</span>
      </div>

      <!-- Messages in this date group -->
      @for (msg of group.messages; track msg.id) {
        <div
          class="message-group"
          [class.own-group]="msg.senderId === currentUserId"
          [class.other-group]="msg.senderId !== currentUserId"
        >
          <app-message-bubble
            [message]="msg"
            [isOwnMessage]="msg.senderId === currentUserId"
          ></app-message-bubble>
        </div>
      }
    }
  </div>
</div>
