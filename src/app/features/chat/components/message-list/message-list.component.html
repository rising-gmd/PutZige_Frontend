<!--
  Message list  CDK virtual scrolling
  =====================================

  Accessibility contract:
  - role="log"         Identifies this as a message log. Screen readers
                       announce log updates according to their own policies
                       without requiring aria-live to be set explicitly.
  - aria-live="polite" New messages are read aloud during the next pause so
                       the user is not interrupted while typing.
  - aria-relevant="additions text"
                       Only additions (new messages) trigger announcements;
                       delivery-status edits do not.
  - aria-label         Provides a human-readable region name for navigation.

  Each message row carries role="article" so AT users can jump between
  messages with the article navigation shortcut.
  Each divider carries role="separator" and an aria-label matching the
  visible date text so the separator is meaningful without the visual.
-->
<cdk-virtual-scroll-viewport
  class="message-list-viewport"
  [itemSize]="itemSize"
  role="log"
  aria-live="polite"
  aria-relevant="additions text"
  aria-label="Conversation messages"
>
  <div
    *cdkVirtualFor="let item of virtualItems; trackBy: trackVirtualItem"
    class="virtual-row"
  >
    @if (item.kind === "divider") {
      <!-- Date group separator -->
      <div class="date-divider" role="separator" [attr.aria-label]="item.date">
        <!-- aria-hidden: the text is already exposed via aria-label above -->
        <span aria-hidden="true">{{ item.date }}</span>
      </div>
    } @else {
      <!-- Individual message -->
      <div
        class="message-group"
        [class.own-group]="item.isOwn"
        [class.other-group]="!item.isOwn"
        role="article"
        [attr.aria-label]="
          (item.isOwn ? 'You' : 'Contact') + ': ' + item.message.messageText
        "
      >
        <app-message-bubble
          [message]="item.message"
          [isOwnMessage]="item.isOwn"
        />
      </div>
    }
  </div>
</cdk-virtual-scroll-viewport>
